<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UNITY !</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #000000;
    --panel: rgba(16,13,22,0.92);
    --panel-border: rgba(255,255,255,0.10);
    --accent: #B084F5;
    --accent-2: #7C4DFF;
    --accent-dim: rgba(176,132,245,0.35);
    --text: #ffffff;
    --muted: #b8a9c9;
    --font: 'Poppins', sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{
    background: var(--bg);
    font-family: var(--font);
    color: var(--text);
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    overflow-x:hidden;
    position:relative;
  }

  /* ============ BACKGROUND MEDIA LAYER ============ */
  #bgMediaWrap{
    position:fixed;
    inset:0;
    z-index:0;
    overflow:hidden;
    background: var(--bg);
  }
  #bgMediaWrap img,
  #bgMediaWrap video{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    object-position:center;
  }
  #bgMediaWrap::after{
    content:"";
    position:absolute;
    inset:0;
    background: rgba(0,0,0,0.55);
  }

  .vignette{
    position:fixed;inset:0;
    z-index:1;
    background: radial-gradient(ellipse at 50% 40%, rgba(124,77,255,0.14), transparent 60%);
    pointer-events:none;
    animation: vignettePulse 3s ease-in-out infinite;
  }
  @keyframes vignettePulse{
    0%,100%{ opacity:0.7; }
    50%{ opacity:1; }
  }
  canvas#fx{
    position:fixed;inset:0;
    z-index:1;
    width:100%;height:100%;
    pointer-events:none;
  }
  .card{
    position:relative;
    z-index:2;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    padding:24px;
    animation: rise .7s ease both;
  }
  @keyframes rise{
    from{opacity:0;transform:translateY(14px);}
    to{opacity:1;transform:translateY(0);}
  }

  .avatar-wrap{
    width:116px;height:116px;
    border-radius:50%;
    padding:3px;
    background: conic-gradient(from 180deg, #ffffff, var(--accent), #ffffff, var(--accent-2), #ffffff);
    box-shadow: 0 0 30px rgba(124,77,255,0.45), 0 0 70px rgba(176,132,245,0.25);
    margin-bottom:20px;
    animation: pulseGlow 1.6s ease-in-out infinite;
  }
  @keyframes pulseGlow{
    0%,100%{ box-shadow: 0 0 30px rgba(124,77,255,0.45), 0 0 70px rgba(176,132,245,0.25); }
    50%{ box-shadow: 0 0 45px rgba(124,77,255,0.75), 0 0 100px rgba(176,132,245,0.45); }
  }
.avatar{
  width:100%;height:100%;
  border-radius:50%;
  object-fit:cover;
  display:block;
  background:#111;
}

h1{
  font-size:28px;
  font-weight:700;
  letter-spacing:0.005em;
  margin-bottom:6px;
  white-space:pre;
}
h1 span{ transition:none; }
h1{ margin-bottom:20px; }

.discord-btn{
  display:flex;align-items:center;gap:8px;
  background: var(--panel);
  border:1px solid var(--panel-border);
  color:var(--text);
  font-family:var(--font);
  font-size:14px;
  font-weight:500;
  padding:9px 18px;
  border-radius:10px;
  cursor:pointer;
  margin-bottom:12px;
  transition: border-color .2s, box-shadow .2s, transform .15s;
}
.discord-btn:hover{
  border-color:var(--accent);
  box-shadow:0 0 18px rgba(124,77,255,0.35);
  transform:translateY(-1px) scale(1.03);
}
.discord-btn.copied{
  border-color:var(--accent);
  color:var(--accent);
  box-shadow:0 0 18px rgba(124,77,255,0.45);
}
.discord-btn svg{width:16px;height:16px;flex-shrink:0;}
.discord-btn svg path{ fill:var(--accent); }

.row{display:flex;gap:10px;margin-bottom:0;flex-wrap:wrap;justify-content:center;}
.tab-btn{
  background: var(--panel);
  border:1px solid var(--panel-border);
  color:var(--text);
  font-family:var(--font);
  font-size:13.5px;
  font-weight:500;
  padding:9px 20px;
  border-radius:10px;
  cursor:pointer;
  transition: border-color .2s, box-shadow .2s, color .2s;
}
.tab-btn:hover{border-color:var(--accent-dim);}
.tab-btn.active{
  border-color:var(--accent);
  color:var(--accent);
  box-shadow:0 0 18px rgba(124,77,255,0.4);
}

.panel{
  width:240px;
  margin-top:12px;
  background: var(--panel);
  border:1px solid var(--panel-border);
  border-radius:14px;
  box-shadow: 0 12px 32px rgba(124,77,255,0.15);
  overflow:hidden;
  max-height:0;
  opacity:0;
  transform:translateY(-6px);
  transition: max-height .35s ease, opacity .3s ease, transform .3s ease, margin-top .35s ease;
}
.panel.open{
  max-height:420px;          /* increased so all names fit */
  opacity:1;
  transform:translateY(0);
}

.panel-inner{
  padding:16px 14px;
  max-height:380px;          /* allows scrolling if list grows */
  overflow-y:auto;
}

/* nice thin scrollbar */
.panel-inner::-webkit-scrollbar{
  width:5px;
}
.panel-inner::-webkit-scrollbar-track{
  background:transparent;
}
.panel-inner::-webkit-scrollbar-thumb{
  background:rgba(176,132,245,0.35);
  border-radius:10px;
}

.frens-list{list-style:none;display:flex;flex-direction:column;gap:10px;}
.frens-list li{
  font-size:13.5px;color:var(--muted);
  padding:6px 0;
  border-bottom:1px solid rgba(255,255,255,0.07);
  transition:color .2s;
}
.frens-list li:last-child{border-bottom:none;}
.frens-list li:hover{color:var(--accent);}

.about-text p{
  font-size:13px;
  color:var(--muted);
  line-height:1.6;
  margin-bottom:10px;
}
.about-text p:last-child{margin-bottom:0;}
.about-text b{color:var(--accent);}
.about-text .type-cursor{
  display:inline-block;
  width:2px;
  height:12px;
  background:var(--accent);
  margin-left:2px;
  vertical-align:-1px;
  animation: blink 0.9s steps(1) infinite;
}
@keyframes blink{
  0%,49%{opacity:1;}
  50%,100%{opacity:0;}
}

  /* invite / social list */
  .invite-list{list-style:none;display:flex;flex-direction:column;gap:8px;}
  .invite-list a{
    display:flex;align-items:center;justify-content:space-between;
    text-decoration:none;
    font-size:13px;
    color:var(--text);
    background:rgba(255,255,255,0.04);
    border:1px solid var(--panel-border);
    border-radius:8px;
    padding:8px 10px;
    transition: border-color .2s, color .2s, background .2s;
  }
  .invite-list a:hover{
    border-color:var(--accent);
    color:var(--accent);
    background:rgba(124,77,255,0.1);
  }
  .invite-list a .label{display:flex;align-items:center;gap:8px;}
  .invite-list a svg{width:14px;height:14px;flex-shrink:0;}
  .invite-list a svg path{fill:var(--muted);transition:fill .2s;}
  .invite-list a:hover svg path{fill:var(--accent);}
  .invite-list a .arrow{opacity:0.5;transition:transform .2s;}
  .invite-list a:hover .arrow{transform:translateX(2px);opacity:1;}

  /* ============ VIEW COUNTER + LIKE BUTTON ============ */
  .meta-row{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:16px;
    margin-top:14px;
  }
  .view-counter{
    display:flex;
    align-items:center;
    gap:6px;
    font-size:12px;
    color:var(--muted);
    letter-spacing:0.02em;
    opacity:0.85;
  }
  .view-counter svg{width:13px;height:13px;flex-shrink:0;}
  .view-counter svg path{ fill:var(--muted); }

  .like-btn{
    display:flex;
    align-items:center;
    gap:6px;
    background:none;
    border:none;
    color:var(--muted);
    font-family:var(--font);
    font-size:12px;
    letter-spacing:0.02em;
    cursor:pointer;
    padding:2px 4px;
    opacity:0.85;
    transition: color .2s, opacity .2s, transform .1s;
  }
  .like-btn:hover{ opacity:1; color:var(--accent); transform:scale(1.05); }
  .like-btn svg{width:15px;height:15px;flex-shrink:0;transition: fill .2s, stroke .2s;}
  .like-btn svg path{
    fill:none;
    stroke:var(--muted);
    stroke-width:1.6;
    transition: fill .2s, stroke .2s;
  }
  .like-btn:hover svg path{ stroke:var(--accent); }
  .like-btn.liked{ color:var(--accent); cursor:default; opacity:1; }
  .like-btn.liked svg path{ fill:var(--accent); stroke:var(--accent); }
  .like-btn.liked:hover{ transform:none; }
  .like-btn.pulse svg{ animation: likePulse .35s ease; }
  @keyframes likePulse{
    0%{ transform:scale(1); }
    40%{ transform:scale(1.3); }
    100%{ transform:scale(1); }
  }

  footer{
    position:fixed;bottom:14px;left:0;right:0;
    text-align:center;
    font-size:11px;
    color:#5c4a73;
    letter-spacing:0.02em;
    z-index:2;
  }

  @media (prefers-reduced-motion: reduce){
    .card{animation:none;}
    .avatar-wrap{animation:none;}
    .vignette{animation:none;}
    .like-btn.pulse svg{animation:none;}
    #typeSubtitle .cursor{animation:none;}
  }
</style>
</head>

<script>
  // ============================================================
  // BACKGROUND MEDIA CONFIG
  // ============================================================
  const BACKGROUND = {
    type: 'image',
    url: 'https://media.discordapp.net/attachments/1464130653153923103/1538101315140583565/heist.gif?ex=6a8416fa&is=6a82c57a&hm=f1b7a02eb0ce966effb07150e70facaafb670c4e969157d1fb14a51103d06461&='
  };

  (function setupBackground(){
    const wrap = document.getElementById('bgMediaWrap');
    if (BACKGROUND.type === 'image' && BACKGROUND.url) {
      const img = document.createElement('img');
      img.src = BACKGROUND.url;
      img.alt = '';
      wrap.appendChild(img);
    } else if (BACKGROUND.type === 'video' && BACKGROUND.url) {
      const vid = document.createElement('video');
      vid.src = BACKGROUND.url;
      vid.autoplay = true;
      vid.muted = true;
      vid.loop = true;
      vid.playsInline = true;
      wrap.appendChild(vid);
      vid.play().catch(() => {});
    }
  })();

  // ============================================================
  // VIEW COUNTER
  // ============================================================
  (function viewCounter(){
    const COUNTER_KEY = 'unity-cpu-bio-unity-2026';
    const el = document.getElementById('viewCount');
    fetch(`https://countapi.mileshilliard.com/api/v1/hit/${COUNTER_KEY}`)
      .then(res => res.json())
      .then(data => { if (el) el.textContent = Number(data.value).toLocaleString(); })
      .catch(() => { if (el) el.textContent = '—'; });
  })();

  // ============================================================
  // LIKE BUTTON
  // ============================================================
  (function likeButton(){
    const LIKE_KEY = 'unity-cpu-bio-unity-2026-likes';
    const STORAGE_FLAG = 'liked_' + LIKE_KEY;
    const btn = document.getElementById('likeBtn');
    const countEl = document.getElementById('likeCount');
    if (!btn || !countEl) return;

    function render(value, liked){
      countEl.textContent = Number(value || 0).toLocaleString();
      btn.classList.toggle('liked', !!liked);
    }

    const alreadyLiked = localStorage.getItem(STORAGE_FLAG) === '1';

    fetch(`https://countapi.mileshilliard.com/api/v1/get/${LIKE_KEY}`)
      .then(res => res.json())
      .then(data => render(data.value, alreadyLiked))
      .catch(() => render(0, alreadyLiked));

    btn.addEventListener('click', () => {
      if (localStorage.getItem(STORAGE_FLAG) === '1') return;
      fetch(`https://countapi.mileshilliard.com/api/v1/hit/${LIKE_KEY}`)
        .then(res => res.json())
        .then(data => {
          localStorage.setItem(STORAGE_FLAG, '1');
          render(data.value, true);
          btn.classList.add('pulse');
          setTimeout(() => btn.classList.remove('pulse'), 350);
        })
        .catch(() => {});
    });
  })();

  // ============ CONFIG: discord invites ============

  ];

  const inviteList = document.getElementById('inviteList');
  INVITES.forEach(inv => {
    const li = document.createElement('li');
    const a = document.createElement('a');
    a.href = inv.url;
    a.target = "_blank";
    a.rel = "noopener noreferrer";
    a.innerHTML = `<span class="label">${inv.label}</span><span class="arrow">→</span>`;
    li.appendChild(a);
    inviteList.appendChild(li);
  });

    twitter: '<path d="M18.9 2H22l-7.6 8.7L23.3 22h-7.3l-5.7-7.1L3.8 22H.7l8.1-9.3L.9 2h7.5l5.1 6.5L18.9 2Zm-1.3 18h1.8L6.5 4h-1.9l13 16Z"/>',
    tiktok: '<path d="M16.6 2h-3.2v13.9a3.1 3.1 0 1 1-2.2-3v-3.3a6.4 6.4 0 1 0 5.5 6.3V8.6c1.2.9 2.7 1.4 4.3 1.4V6.8c-2.4 0-4.4-1.9-4.4-4.3V2Z"/>',
    instagram: '<path d="M12 2.2c3.2 0 3.6 0 4.9.07 1.2.06 2 .24 2.7.52.7.28 1.3.66 1.9 1.26.6.6.98 1.2 1.26 1.9.28.7.46 1.5.52 2.7.07 1.3.07 1.7.07 4.9s0 3.6-.07 4.9c-.06 1.2-.24 2-.52 2.7-.28.7-.66 1.3-1.26 1.9-.6.6-1.2.98-1.9 1.26-.7.28-1.5.46-2.7.52-1.3.07-1.7.07-4.9.07s-3.6 0-4.9-.07c-1.2-.06-2-.24-2.7-.52-.7-.28-1.3-.66-1.9-1.26-.6-.6-.98-1.2-1.26-1.9-.28-.7-.46-1.5-.52-2.7C2.2 15.6 2.2 15.2 2.2 12s0-3.6.07-4.9c.06-1.2.24-2 .52-2.7.28-.7.66-1.3 1.26-1.9.6-.6 1.2-.98 1.9-1.26.7-.28 1.5-.46 2.7-.52C8.4 2.2 8.8 2.2 12 2.2Zm0 3a6.8 6.8 0 1 0 0 13.6 6.8 6.8 0 0 0 0-13.6Zm0 11.2a4.4 4.4 0 1 1 0-8.8 4.4 4.4 0 0 1 0 8.8Zm7-11.4a1.6 1.6 0 1 1-3.2 0 1.6 1.6 0 0 1 3.2 0Z"/>',
    twitch: '<path d="M4.3 2 3 5.6v13.7h4.7V22l3.6-2.7h3l6-5.4V2H4.3Zm14.9 10.4-3.1 2.8h-3.1l-2.7 2v-2h-3.7V3.4h12.6v9Z"/>',
  };

  const socialList = document.getElementById('socialList');
  SOCIALS.forEach(soc => {
    const li = document.createElement('li');
    const a = document.createElement('a');
    a.href = soc.url;
    a.target = "_blank";
    a.rel = "noopener noreferrer";
    const iconSvg = soc.icon && SOCIAL_ICONS[soc.icon]
      ? `<svg viewBox="0 0 24 24" fill="none">${SOCIAL_ICONS[soc.icon]}</svg>`
      : '';
    a.innerHTML = `<span class="label">${iconSvg}${soc.label}</span><span class="arrow">→</span>`;
    li.appendChild(a);
    socialList.appendChild(li);
  });

  // discord copy-to-clipboard
  const discordBtn = document.getElementById('discordBtn');
  const discordLabel = document.getElementById('discordLabel');
  const discordTag = 'unity_da_modda';
  discordBtn.addEventListener('click', () => {
    navigator.clipboard?.writeText(discordTag).catch(()=>{});
    discordLabel.textContent = 'Copied!';
    discordBtn.classList.add('copied');
    setTimeout(() => {
      discordLabel.textContent = discordTag;
      discordBtn.classList.remove('copied');
    }, 1500);
  });

  // tab toggle (accordion, only one open at a time)
  const tabs = document.querySelectorAll('.tab-btn');
  const panels = {
    frens: document.getElementById('panel-frens'),
    about: document.getElementById('panel-about'),
    invites: document.getElementById('panel-invites'),
    socials: document.getElementById('panel-socials')
  };
  let activeTab = null;

  tabs.forEach(btn => {
    btn.addEventListener('click', () => {
      const key = btn.dataset.tab;
      if (activeTab === key) {
        panels[key].classList.remove('open');
        btn.classList.remove('active');
        activeTab = null;
        return;
      }
      tabs.forEach(b => b.classList.remove('active'));
      Object.values(panels).forEach(p => p.classList.remove('open'));
      btn.classList.add('active');
      panels[key].classList.add('open');
      activeTab = key;
    });
  });

  // ============ MUSIC (background, no visible control) ============
  const bgm = document.getElementById('bgm');
  let unmutedYet = false;

  bgm.muted = true;
  bgm.play().catch(() => {});

  function unmuteOnFirstInteraction(){
    if (unmutedYet) return;
    unmutedYet = true;
    bgm.muted = false;
    if (bgm.paused) bgm.play().catch(() => {});
    window.removeEventListener('click', unmuteOnFirstInteraction);
    window.removeEventListener('keydown', unmuteOnFirstInteraction);
    window.removeEventListener('touchstart', unmuteOnFirstInteraction);
  }
  window.addEventListener('click', unmuteOnFirstInteraction);
  window.addEventListener('keydown', unmuteOnFirstInteraction);
  window.addEventListener('touchstart', unmuteOnFirstInteraction);

  // ============ SWEEP TEXT ANIMATOR ============
  const sweepTitle = document.getElementById('sweepTitle');
  const sweepContent = sweepTitle.textContent;
  sweepTitle.innerHTML = '';
  const sweepSpans = [...sweepContent].map(ch => {
    const span = document.createElement('span');
    span.textContent = ch === ' ' ? '\u00A0' : ch;
    span.style.display = 'inline-block';
    sweepTitle.appendChild(span);
    return span;
  });

  const SWEEP_DURATION = 1.1;
  const SWEEP_SPEED = 0.7;
  const COLOR_A = [141, 92, 255];
  const COLOR_B = [255, 255, 255];

  function lerp(a, b, t){ return a + (b - a) * t; }
  function repeat(t, length){ return t - Math.floor(t / length) * length; }

  let sweepStart = performance.now();
  function sweepTick(now){
    const timer = ((now - sweepStart) / 1000) * SWEEP_SPEED;
    const len = sweepSpans.length;
    sweepSpans.forEach((span, i) => {
      const offset = (timer / SWEEP_DURATION) - (i / len);
      const normalized = Math.abs(repeat(offset, 1.0) * 2.0 - 1.0);
      const r = Math.round(lerp(COLOR_A[0], COLOR_B[0], normalized));
      const g = Math.round(lerp(COLOR_A[1], COLOR_B[1], normalized));
      const b = Math.round(lerp(COLOR_A[2], COLOR_B[2], normalized));
      span.style.color = `rgb(${r},${g},${b})`;
      span.style.textShadow = `0 0 ${8 + normalized*10}px rgba(${r},${g},${b},0.9)`;
    });
    requestAnimationFrame(sweepTick);
  }

  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches){
    sweepSpans.forEach((span, i) => {
      const t = i / Math.max(sweepSpans.length - 1, 1);
      const r = Math.round(lerp(COLOR_B[0], COLOR_A[0], t));
      const g = Math.round(lerp(COLOR_B[1], COLOR_A[1], t));
      const b = Math.round(lerp(COLOR_B[2], COLOR_A[2], t));
      span.style.color = `rgb(${r},${g},${b})`;
    });
  } else {
    requestAnimationFrame(sweepTick);
  }

  // ============ ABOUT ME TYPING ANIMATION ============
  // Types out each <p data-full="..."> line in #aboutText, one at a time,
  // whenever the "about me" tab is opened. Re-types fresh every time it's opened.
  (function aboutTyping(){
    const container = document.getElementById('aboutText');
    if (!container) return;
    const paragraphs = [...container.querySelectorAll('p[data-full]')];
    const CHAR_SPEED = 28;       // ms per character
    const LINE_GAP = 250;        // ms pause between lines
    let typing = false;

    function resetParagraphs(){
      paragraphs.forEach(p => { p.textContent = ''; });
    }

    function typeLine(i, cb){
      if (i >= paragraphs.length){ cb(); return; }
      const p = paragraphs[i];
      const full = p.dataset.full;
      const bold = p.dataset.bold === 'true';
      let idx = 0;
      const cursor = document.createElement('span');
      cursor.className = 'type-cursor';

      function step(){
        idx++;
        const shown = full.slice(0, idx);
        p.innerHTML = '';
        if (bold){
          const b = document.createElement('b');
          b.textContent = shown;
          p.appendChild(b);
        } else {
          p.appendChild(document.createTextNode(shown));
        }
        p.appendChild(cursor);
        if (idx < full.length){
          setTimeout(step, CHAR_SPEED);
        } else {
          cursor.remove();
          setTimeout(() => typeLine(i + 1, cb), LINE_GAP);
        }
      }
      step();
    }

    function playTyping(){
      if (typing) return;
      typing = true;
      resetParagraphs();
      typeLine(0, () => { typing = false; });
    }

    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches){
      paragraphs.forEach(p => {
        const full = p.dataset.full;
        p.textContent = full;
      });
    } else {
      // hook into the existing about tab button
      const aboutBtn = document.querySelector('.tab-btn[data-tab="about"]');
      if (aboutBtn) aboutBtn.addEventListener('click', () => setTimeout(playTyping, 50));
    }
  })();

  // ============ purple/white drifting particles ============
  const canvas = document.getElementById('fx');
  const ctx = canvas.getContext('2d');
  let w, h, particles;

  function resize(){
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
  }
  function initParticles(){
    particles = Array.from({length: 90}, () => ({
      x: Math.random()*w,
      y: Math.random()*h,
      r: Math.random()*2.2 + 0.4,
      vy: Math.random()*0.5 + 0.15,
      vx: (Math.random()-0.5) * 0.6,
      o: Math.random()*0.6 + 0.2,
      purple: Math.random() > 0.4
    }));
  }
  let fxTime = 0;
  function tick(){
    fxTime += 0.02;
    ctx.clearRect(0,0,w,h);
    for(const p of particles){
      ctx.fillStyle = p.purple ? '#B084F5' : '#FFFFFF';
      ctx.globalAlpha = p.o * (0.6 + Math.sin(fxTime * 3 + p.x) * 0.4);
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
      ctx.fill();
      p.y -= p.vy;
      p.x += p.vx;
      if(p.y < -5){ p.y = h+5; p.x = Math.random()*w; }
      if(p.x < -5) p.x = w+5;
      if(p.x > w+5) p.x = -5;
    }
    ctx.globalAlpha = 1;
    requestAnimationFrame(tick);
  }

  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  resize();
  initParticles();
  window.addEventListener('resize', () => { resize(); initParticles(); });
  if(!reduceMotion) tick();
</script>
