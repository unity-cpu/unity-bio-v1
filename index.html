<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UNITY !</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #000000;
    --panel: rgba(16,13,22,0.92);
    --panel-border: rgba(255,255,255,0.08);
    --accent: #B084F5;
    --accent-2: #7C4DFF;
    --accent-dim: rgba(176,132,245,0.32);
    --text: #f2f2f2;
    --muted: #9a9299;
    --font: 'Poppins', sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{
    background: var(--bg);
    font-family: var(--font);
    color: var(--text);
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    overflow-x:hidden;
    position:relative;
  }

  .vignette{
    position:fixed;inset:0;
    background: radial-gradient(ellipse at 50% 40%, rgba(124,77,255,0.08), transparent 60%);
    pointer-events:none;
  }
  canvas#fx{
    position:fixed;inset:0;
    width:100%;height:100%;
    pointer-events:none;
  }

  .card{
    position:relative;
    z-index:2;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    padding:24px;
    animation: rise .7s ease both;
  }
  @keyframes rise{
    from{opacity:0;transform:translateY(14px);}
    to{opacity:1;transform:translateY(0);}
  }

  .avatar-wrap{
    width:116px;height:116px;
    border-radius:50%;
    padding:3px;
    background: conic-gradient(from 180deg, var(--accent-2), var(--accent), var(--accent-2));
    box-shadow: 0 0 30px rgba(176,132,245,0.28), 0 0 70px rgba(124,77,255,0.14);
    margin-bottom:20px;
  }
  .avatar{
    width:100%;height:100%;
    border-radius:50%;
    object-fit:cover;
    display:block;
    background:#111;
  }

  h1{
    font-size:28px;
    font-weight:700;
    letter-spacing:0.005em;
    margin-bottom:20px;
    white-space:pre;
  }
  h1 span{ transition:none; }

  .discord-btn{
    display:flex;align-items:center;gap:8px;
    background: var(--panel);
    border:1px solid var(--panel-border);
    color:var(--text);
    font-family:var(--font);
    font-size:14px;
    font-weight:500;
    padding:9px 18px;
    border-radius:10px;
    cursor:pointer;
    margin-bottom:12px;
    transition: border-color .2s, box-shadow .2s, transform .15s;
  }
  .discord-btn:hover{
    border-color:var(--accent);
    box-shadow:0 0 16px rgba(176,132,245,0.22);
    transform:translateY(-1px);
  }
  .discord-btn.copied{
    border-color:var(--accent);
    color:var(--accent);
    box-shadow:0 0 16px rgba(176,132,245,0.3);
  }
  .discord-btn svg{width:16px;height:16px;flex-shrink:0;}

  .row{display:flex;gap:10px;margin-bottom:0;flex-wrap:wrap;justify-content:center;}
  .tab-btn{
    background: var(--panel);
    border:1px solid var(--panel-border);
    color:var(--text);
    font-family:var(--font);
    font-size:13.5px;
    font-weight:500;
    padding:9px 20px;
    border-radius:10px;
    cursor:pointer;
    transition: border-color .2s, box-shadow .2s, color .2s;
  }
  .tab-btn:hover{border-color:var(--accent-dim);}
  .tab-btn.active{
    border-color:var(--accent);
    color:var(--accent);
    box-shadow:0 0 16px rgba(176,132,245,0.22);
  }

  .panel{
    width:240px;
    margin-top:12px;
    background: var(--panel);
    border:1px solid var(--panel-border);
    border-radius:14px;
    box-shadow: 0 12px 32px rgba(0,0,0,0.45);
    overflow:hidden;
    max-height:0;
    opacity:0;
    transform:translateY(-6px);
    transition: max-height .35s ease, opacity .3s ease, transform .3s ease, margin-top .35s ease;
  }
  .panel.open{
    max-height:360px;
    opacity:1;
    transform:translateY(0);
  }

  .panel-inner{padding:16px 14px;}
  .frens-list{list-style:none;display:flex;flex-direction:column;gap:10px;}
  .frens-list li{
    font-size:13.5px;color:var(--muted);
    padding:6px 0;
    border-bottom:1px solid rgba(255,255,255,0.05);
    transition:color .2s;
  }
  .frens-list li:last-child{border-bottom:none;}
  .frens-list li:hover{color:var(--accent);}

  .about-text p{
    font-size:13px;
    color:var(--muted);
    line-height:1.6;
    margin-bottom:10px;
  }
  .about-text p:last-child{margin-bottom:0;}
  .about-text b{color:var(--text);}

  /* invite list */
  .invite-list{list-style:none;display:flex;flex-direction:column;gap:8px;}
  .invite-list a{
    display:flex;align-items:center;justify-content:space-between;
    text-decoration:none;
    font-size:13px;
    color:var(--text);
    background:rgba(255,255,255,0.03);
    border:1px solid var(--panel-border);
    border-radius:8px;
    padding:8px 10px;
    transition: border-color .2s, color .2s, background .2s;
  }
  .invite-list a:hover{
    border-color:var(--accent);
    color:var(--accent);
    background:rgba(176,132,245,0.06);
  }
  .invite-list a .arrow{opacity:0.5;transition:transform .2s;}
  .invite-list a:hover .arrow{transform:translateX(2px);opacity:1;}

  footer{
    position:fixed;bottom:14px;left:0;right:0;
    text-align:center;
    font-size:11px;
    color:#444;
    letter-spacing:0.02em;
    z-index:2;
  }

  @media (prefers-reduced-motion: reduce){
    .card{animation:none;}
  }
</style>
</head>
<body>

<div class="vignette"></div>
<canvas id="fx"></canvas>

<!-- ============ MUSIC (plays silently in background, no visible icon/button) ============ -->
<audio id="bgm" loop preload="none">
  <source src="https://raw.githubusercontent.com/unity-cpu/gaybez-is-gay/main/really%20cool%20music%20aka%20chill%20zone.mp3" type="audio/mpeg">
</audio>

<div class="card">
  <div class="avatar-wrap">
    <img class="avatar" src="https://media.discordapp.net/attachments/1531488818841129010/1531904074927046736/917e17f923a155b858eaaf70c83c4531.webp?ex=6a6ae858&is=6a6996d8&hm=d05b0b55e3bf8c7f4285180a0f5473662e0d380a867bb59f578109dfaa40a667&=&format=webp" alt="avatar">
  </div>

  <h1 id="sweepTitle">Unity!</h1>

  <button class="discord-btn" id="discordBtn">
    <svg viewBox="0 0 24 24" fill="none"><path d="M20.317 4.37a19.79 19.79 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.056 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028 14.09 14.09 0 0 0 1.226-1.994.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128c.126-.094.252-.192.372-.291a.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.099.246.197.373.291a.077.077 0 0 1-.006.128 12.3 12.3 0 0 1-1.873.892.076.076 0 0 0-.04.106c.36.698.772 1.362 1.225 1.994a.077.077 0 0 0 .084.028 19.84 19.84 0 0 0 6.001-3.03.077.077 0 0 0 .032-.055c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.028ZM8.02 15.33c-1.183 0-2.157-1.086-2.157-2.42 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.42-2.157 2.42Zm7.975 0c-1.183 0-2.157-1.086-2.157-2.42 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.42-2.157 2.42Z" fill="#B084F5"/></svg>
    <span id="discordLabel">unity_da_modda</span>
  </button>

  <div class="row">
    <button class="tab-btn" data-tab="frens">frens</button>
    <button class="tab-btn" data-tab="about">about me</button>
    <button class="tab-btn" data-tab="invites">servers</button>
  </div>

  <div class="panel" id="panel-frens">
    <div class="panel-inner">
      <ul class="frens-list">
        <li>cloudz &lt;3</li>
        <li>crazy</li>
        <li>bunny he help me with gradient</li>
        <li>sot</li>
        <li>frog</li>
        <li>why</li>
      </ul>
    </div>
  </div>

  <div class="panel" id="panel-about">
    <div class="panel-inner about-text">
      <p><b>im unity !</b></p>
      <p>I like listening to music and I love cats.</p>
      <p>I like to code (experienced skid)</p>
    </div>
  </div>

  <!-- ============ DISCORD INVITES ============ -->
  <!-- Edit the INVITES array in the script below to add/remove servers -->
  <div class="panel" id="panel-invites">
    <div class="panel-inner">
      <ul class="invite-list" id="inviteList"></ul>
    </div>
  </div>
</div>

<footer>unity.lolz</footer>

<script>
  // ============ CONFIG: discord invites ============
  const INVITES = [
    { label: "apk studio", url: "https://discord.gg/J2ezjghdBN" },
    { label: "Modlab", url: "https://discord.gg/SM9EhM4mNX" },
    { label: "cgh", url: "https://discord.gg/npD2H4AFc2" },
  ];

  const inviteList = document.getElementById('inviteList');
  INVITES.forEach(inv => {
    const li = document.createElement('li');
    const a = document.createElement('a');
    a.href = inv.url;
    a.target = "_blank";
    a.rel = "noopener noreferrer";
    a.innerHTML = `<span>${inv.label}</span><span class="arrow">→</span>`;
    li.appendChild(a);
    inviteList.appendChild(li);
  });

  // discord copy-to-clipboard
  const discordBtn = document.getElementById('discordBtn');
  const discordLabel = document.getElementById('discordLabel');
  const discordTag = 'unity_da_modda';
  discordBtn.addEventListener('click', () => {
    navigator.clipboard?.writeText(discordTag).catch(()=>{});
    discordLabel.textContent = 'Copied!';
    discordBtn.classList.add('copied');
    setTimeout(() => {
      discordLabel.textContent = discordTag;
      discordBtn.classList.remove('copied');
    }, 1500);
  });

  // tab toggle (accordion, only one open at a time)
  const tabs = document.querySelectorAll('.tab-btn');
  const panels = {
    frens: document.getElementById('panel-frens'),
    about: document.getElementById('panel-about'),
    invites: document.getElementById('panel-invites')
  };
  let activeTab = null;

  tabs.forEach(btn => {
    btn.addEventListener('click', () => {
      const key = btn.dataset.tab;
      if (activeTab === key) {
        panels[key].classList.remove('open');
        btn.classList.remove('active');
        activeTab = null;
        return;
      }
      tabs.forEach(b => b.classList.remove('active'));
      Object.values(panels).forEach(p => p.classList.remove('open'));
      btn.classList.add('active');
      panels[key].classList.add('open');
      activeTab = key;
    });
  });

  // ============ MUSIC (background, no visible control) ============
  // Browsers block autoplay WITH sound, no way around that. Standard
  // workaround: autoplay muted on load, unmute on first user interaction
  // anywhere on the page (click/tap/keypress).
  const bgm = document.getElementById('bgm');
  let unmutedYet = false;

  bgm.muted = true;
  bgm.play().catch(() => {});

  function unmuteOnFirstInteraction(){
    if (unmutedYet) return;
    unmutedYet = true;
    bgm.muted = false;
    if (bgm.paused) bgm.play().catch(() => {});
    window.removeEventListener('click', unmuteOnFirstInteraction);
    window.removeEventListener('keydown', unmuteOnFirstInteraction);
    window.removeEventListener('touchstart', unmuteOnFirstInteraction);
  }
  window.addEventListener('click', unmuteOnFirstInteraction);
  window.addEventListener('keydown', unmuteOnFirstInteraction);
  window.addEventListener('touchstart', unmuteOnFirstInteraction);

  // ============ SWEEP TEXT ANIMATOR ============
  // Ported from the Unity C# SweepTextAnimator: for each character, lerp
  // between colorA (purple) and colorB (white) based on a moving offset
  // so a "wave" of color sweeps across the text on a loop.
  const sweepTitle = document.getElementById('sweepTitle');
  const sweepContent = sweepTitle.textContent;
  sweepTitle.innerHTML = '';
  const sweepSpans = [...sweepContent].map(ch => {
    const span = document.createElement('span');
    span.textContent = ch;
    sweepTitle.appendChild(span);
    return span;
  });

  const SWEEP_DURATION = 2.5;   // seconds, matches `duration` in the C# script
  const SWEEP_SPEED = 1.0;      // matches `speed`
  const COLOR_A = [141, 92, 255];   // purple, matches colorA (0.553, 0.361, 1.0)
  const COLOR_B = [255, 255, 255];  // white, matches colorB

  function lerp(a, b, t){ return a + (b - a) * t; }
  function repeat(t, length){ return t - Math.floor(t / length) * length; }

  let sweepStart = performance.now();
  function sweepTick(now){
    const timer = ((now - sweepStart) / 1000) * SWEEP_SPEED;
    const len = sweepSpans.length;
    sweepSpans.forEach((span, i) => {
      const offset = (timer / SWEEP_DURATION) - (i / len);
      const normalized = Math.abs(repeat(offset, 1.0) * 2.0 - 1.0);
      const r = Math.round(lerp(COLOR_A[0], COLOR_B[0], normalized));
      const g = Math.round(lerp(COLOR_A[1], COLOR_B[1], normalized));
      const b = Math.round(lerp(COLOR_A[2], COLOR_B[2], normalized));
      span.style.color = `rgb(${r},${g},${b})`;
    });
    requestAnimationFrame(sweepTick);
  }

  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches){
    sweepSpans.forEach((span, i) => {
      const t = i / Math.max(sweepSpans.length - 1, 1);
      const r = Math.round(lerp(COLOR_B[0], COLOR_A[0], t));
      const g = Math.round(lerp(COLOR_B[1], COLOR_A[1], t));
      const b = Math.round(lerp(COLOR_B[2], COLOR_A[2], t));
      span.style.color = `rgb(${r},${g},${b})`;
    });
  } else {
    requestAnimationFrame(sweepTick);
  }

  // faint drifting particles on black bg
  const canvas = document.getElementById('fx');
  const ctx = canvas.getContext('2d');
  let w, h, particles;

  function resize(){
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
  }
  function initParticles(){
    particles = Array.from({length: 45}, () => ({
      x: Math.random()*w,
      y: Math.random()*h,
      r: Math.random()*1.4 + 0.3,
      vy: Math.random()*0.15 + 0.03,
      o: Math.random()*0.4 + 0.1
    }));
  }
  function tick(){
    ctx.clearRect(0,0,w,h);
    ctx.fillStyle = '#B084F5';
    for(const p of particles){
      ctx.globalAlpha = p.o;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
      ctx.fill();
      p.y -= p.vy;
      if(p.y < -5){ p.y = h+5; p.x = Math.random()*w; }
    }
    ctx.globalAlpha = 1;
    requestAnimationFrame(tick);
  }

  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  resize();
  initParticles();
  window.addEventListener('resize', () => { resize(); initParticles(); });
  if(!reduceMotion) tick();
</script>

</body>
</html>
